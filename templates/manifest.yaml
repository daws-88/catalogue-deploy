apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
data:
  MONGO: "true"
  MONGO_URL: {{ .Values.configMap.MONGO_URL }}
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
   # these are replica set labels
  labels:
    project: roboshop
    component: catalogue
    tier: backend

spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
       project: roboshop
       component: catalogue
       tier: backend
  template:
    metadata:
    ## pod labels
      labels:
       project: roboshop
       component: catalogue
       tier: backend
    spec:
      containers:
      - name: catalogue
        image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deployment.version }}"
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: catalogue
        readinessProbe:
           httpGet:
             path: /health
             port: 8080
           failureThreshold: 1
           periodSeconds: 10
        livenessProbe:
           httpGet:
              path: /health
              port: 8080
           failureThreshold: 1
           periodSeconds: 10
            
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: catalogue
    tier: backend

  ports:
    - protocol: TCP
      port: {{ .Values.service.servicePort }} ## service port
      targetPort: 8080  ## container port